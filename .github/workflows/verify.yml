name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The example is a complete project root, so the checker runs against it the
      # same way it runs against a real one. Every rule in checks.md is a tested rule.
      - name: Verify the example fixture
        working-directory: example
        run: node ../skills/application-verify/scripts/verify.mjs --all

      # The one rule that is not negotiable. Scoped to the content directories:
      # README and the manifests carry the maintainer's own handle on purpose.
      # "Microsoft Edge.app" is a browser path in render_pdf.mjs's Chrome discovery
      # list, and is the only allowed match inside this scope.
      - name: No real personal data
        run: |
          if grep -rniE '\b(christian|macedo|xtian|MSFT|Xbox|Redmond|La Salle|Logic20|PGCgroup|Datadog|Wallapop|Betsson|Expedia|Frontiers|Moove|Pleo|OrgStore)\b|Microsoft' \
               skills commands reference example \
             | grep -v 'Microsoft Edge.app'; then
            echo "::error::Real personal data found. See CONTRIBUTING.md."
            exit 1
          fi
          echo "clean"

      - name: Plugin manifest is valid JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json','utf8'))"
